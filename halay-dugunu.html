<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">

<style>

canvas{display:block;height:100vh;aspect-ratio:9/16;margin:0 auto;max-width:100%}

<canvas id="c" width="1080" height="1920"></canvas>
<div id="p">

function setRole(p,r){const was=ring.includes(p);p.role=r;

function grant(u,r,male){const now=Date.now();let p=P[u];tot[u]=(tot[u]||0)-PRICE[r];saveTot();
 if(p&&p.role==r){p.exp=now+stay(r)*1000;say(p,'Süre uzadı! +3 dk',2200);confetti(40,false);return}
 const old=holder(r,p);if(old)old.rep=true;
 const fresh=!p;if(fresh)p=enter(u,r,male);else setRole(p,r);
 if(INTRO.length>=8){if(old){old.rep=false;throwOut(old)}p.exp=now+stay(r)*1000;return}
 p.pend=true;if(fresh)p.hid=true;
 INTRO.push({p,r,old})}
// Sahnede olmayan biri hediye atarsa, aynı fiyattaki iki roldan boş olanı alsın (gelin/damat, nedime/sağdıç)
function pickMale(u){const c=tot[u]||0;
 for(const[a,b,lo,hi]of[['dam','gel',PRICE.gel,PRICE.akraba],['sag','ned',PRICE.sag,PRICE.gel]])
  if(c>=lo&&c<hi){const av=!holder(a),bv=!holder(b);if(av!=bv)return av}
 return Math.random()<.5}
function onGift(u,c){u=(u||'').trim();c=+c;if(!u||!(c>0))return;tot[u]=(tot[u]||0)+c;heatUp(c);
 const p=P[u];if(p&&(p.out||p.leave||p.pend)){saveTot();return}
 const male=p?p.male:pickMale(u),r=bestRole(u,male);
 if(!r||(p&&p.role&&p.role!=r&&RK[r]<=RK[p.role])){saveTot();return}
 // Kötü akraba tek kişi: biri varsa diğeri sırada bekler (coin harcanmaz, sıra gelince rol verilir)
 if(r=='akraba'&&!(p&&p.role=='akraba')&&holder('akraba')){if(!AQ.includes(u))AQ.push(u);saveTot();return}
 if(!p&&r=='l'&&ring.length>=CFG.max&&!holder('l')){WL.add(u);if(!queue.includes(u))queue.push(u);saveTot();return}
 grant(u,r,male)}
function onChat(u,t){u=(u||'').trim();t=String(t==null?'':t).trim();if(!u||!t)return;
 let p=P[u];if(p&&(p.out||p.leave))return;
 if(!p){if(ring.length>=CFG.max){if(!queue.includes(u))queue.push(u);return}
  const qi=queue.indexOf(u);if(qi>=0)queue.splice(qi,1);enter(u,'n');p=P[u]}
 if(/^de[ğg]i[şs]tir$/i.test(t)){if(RK[p.role]<3)p.male=!p.male;return}
 say(p,t.slice(0,30),7000)}

const DEBUG=location.hash.includes('debug');
function tfHandle(m){let ev=m.event||m.type,d=m.data||m;if(!ev||!d)return;
 const u=d.uniqueId||d.nickname;if(!u)return;
 if(DEBUG)console.log('TikFinity',ev,d);
 if(ev=='chat'){onChat(u,d.comment||d.message||'')}
 else if(ev=='gift'){if(d.giftType===1&&d.repeatEnd===false)return;
  const coins=(d.diamondCount||0)*(d.repeatCount||1);if(coins>0)onGift(u,coins)}}
function tfConnect(){let ws;try{ws=new WebSocket('ws://localhost:21213/')}catch(e){setTimeout(tfConnect,5000);return}
 ws.onmessage=e=>{try{const m=JSON.parse(e.data);(Array.isArray(m)?m:[m]).forEach(tfHandle)}catch(x){}};
 ws.onclose=()=>setTimeout(tfConnect,3000);ws.onerror=()=>{try{ws.close()}catch(e){}}}
if(!location.hash.includes('test'))tfConnect();
