<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">

<small>H tuşu paneli gizler. OBS için adresin sonuna #obs ekle. Mesaj yazan herkes halaya katılır (ücretsiz). Hediye sadece özel roller içindir. "değiş" yazınca karakter değişir.</small>
</div>
<script>
// Ayarlar: hediye değeri eşikleri ve süreler (saniye)
// stay: özel roller 8 dk, stayAk: akraba (saçı) 26 sn, stayFree: yorumla katılan halaycı 20 dk (yazdıkça/beğendikçe süre yenilenir; yer gerekirse en uzun süredir sessiz olan çıkar), davul/zurna: 8 dk
// Tempo: her hediye heatBase+değer*heatPer kadar tempo ekler ve holdBase+değer*holdPer sn o hızda tutar (en çok holdMax sn); sonra decay sn'de sıfıra iner
const CFG={leader:5,davul:5,zurna:5,sag:10,ned:10,dam:20,gel:20,akraba:30,stay:480,stayAk:26,sacDur:20,stayFree:1200,max:100,minStay:15,takiDur:45,stayMus:480,msDur:25,evEvery:270,msEvery:480,tkEvery:720,scEvery:1200,quiet:25,likeStep:1000,likeCap:.3,likeRef:10,likeTau:10,likeRise:.35,likeFall:.007,likeBoost:.4,likeMax:.75,likeToast:15,celAt:[1000,2500,5000],celEvery:5000,heatBase:.14,heatPer:.36,holdBase:12,holdPer:.5,holdMax:150,decay:80,evMin:4,evDur:39,tkQ:8,handsOn:.3,handsOff:.18,handsCool:14,camMin:24,camMax:46};
const VERSION='v1.5c';document.title='Halay Düğünü '+VERSION;
const cv=document.getElementById('c'),g=cv.getContext('2d'),pn=document.getElementById('p');
if(!location.hash.includes('test'))pn.style.display='none';
addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H')pn.style.display=pn.style.display=='none'?'':'none'});
const SK_KEY='halayToplam';
if(location.hash.includes('reset')){try{localStorage.removeItem(SK_KEY)}catch(e){}}
let tot0={};try{tot0=JSON.parse(localStorage.getItem(SK_KEY)||'{}')||{}}catch(e){}
let HEAT=0,PHASE=0,COSTU=0,coolC=0,hotPrev=false,kid=null,nextEv=Date.now()/1000+15,SHK=0,TM=1,HOLD=0,LASTB='';
const GD={v:1,vel:0,pp:0,ring:0,pm:1};let HUF=0,AKS=null;const NT=[]; // GD: tempo kadranı animasyonu, HUF: ellerin havada kalma bitişi, AKS: akraba saçı gösterisi, NT: saçılan banknotlar

const CONF=[];
const JOKES=['Hayırlı Olsun','Pilav bitti!','Damat nerede?','Oy oy oy!','Hep beraber!','Gelin güzel olmuş'];
function confetti(n,fromTop){for(let i=0;i<n;i++)CONF.push({x:Math.random()*1080,y:fromTop?-20-Math.random()*180:350+Math.random()*150,vx:-60+Math.random()*120,vy:fromTop?100+Math.random()*220:-(150+Math.random()*350),rot:Math.random()*6.28,vr:-8+Math.random()*16,c:['#e53935','#fdd835','#1e88e5','#43a047','#fb8c00','#ec407a','#ffffff'][Math.floor(Math.random()*7)],sz:8+Math.random()*8,life:3+Math.random()*2});if(CONF.length>400)CONF.splice(0,CONF.length-400)}
function tmBump(d){if(d>=.06){const t=Date.now()/1000;HUF=Math.max(HUF,t+9);CMT.hq=t+8}} // tempo yükselince: 9 sn eller havada + ellerine yakın çekim isteği
function heatUp(c){const k=Math.min(c,100),h0=HEAT;HEAT=Math.min(1,HEAT+CFG.heatBase+k/100*CFG.heatPer);HOLD=Math.min(CFG.holdMax,HOLD+CFG.holdBase+k*CFG.holdPer);tmBump(HEAT-h0)}
// Hediye atan kişi ekranda "X tempoyu artırdı!" diye görünür, ekran sallanır
const TOASTS=[];
// gd=true: 1 jetonluk küçük hediye (gül) "X gram altın taktı!" yazar; diğerleri "X tempoyu artırdı!"
function toast(u,c,gd){LASTB=u;gd=!!gd;const now=Date.now(),l=TOASTS[TOASTS.length-1];
 if(l&&!!l.gd==gd&&l.u==u&&now-l.t0<4000){l.n+=gd?c:1;l.t0=now}else{TOASTS.push({u,n:gd?c:1,gd,born:now,t0:now});if(TOASTS.length>3)TOASTS.shift()}
 SHK=Math.max(SHK,9+Math.min(c,100)*.18);confetti(Math.min(50,8+Math.round(c*.5)),false)}
// ---- Beğeniler: her beğeni sessizce biraz tempo ekler (en çok likeCap'e kadar), her likeStep beğenide ekstra hızlanma + kısa bildirim ----
const LK={n:0,tot:0,tl:0,lt:0,ms:0,tc:0,acc:0,rate:0,h:0};

function onLike(u,c){c=Math.floor(+c);if(!(c>0))return;c=Math.min(c,2000);touch(P[u]);LK.tot+=c;LK.n+=c;LK.lt=Date.now();celCheck();
 if(TK&&TK.ph!='end'){LK.n%=CFG.likeStep;return}
 LK.acc+=c;
 let k=0;while(LK.n>=CFG.likeStep&&k<3){LK.n-=CFG.likeStep;k++}LK.n%=CFG.likeStep;
 if(k){const now=Date.now(),h0=HEAT;LK.h=Math.min(CFG.likeMax,Math.max(LK.h,HEAT)+CFG.likeBoost*Math.min(k,2));if(HEAT<LK.h)HEAT=LK.h;tmBump(HEAT-h0);HOLD=Math.max(HOLD,6);LK.ms=now; // her 1000 beğenide tempo yükselir, sonra yavaşça (likeFall/sn) düşer
  if(now-LK.tc>CFG.likeToast*1000){LK.tc=now;SHK=Math.max(SHK,10);confetti(40,false)}}}
// beğeni hızı (sn'de kaç) ~10 sn'lik ortalamayla ölçülür; tempo hedefi hıza göre belirlenir (likeRef beğeni/sn = tavan likeCap). Hedef düşünce tempo yavaşça iner
function lkTick(dt){LK.rate+=(LK.acc/Math.max(dt,.001)-LK.rate)*(1-Math.exp(-dt/CFG.likeTau));LK.acc=0;if(LK.rate<.02)LK.rate=0;
 const tg=CFG.likeCap*Math.min(1,LK.rate/CFG.likeRef);
 if(tg>LK.h)LK.h+=(tg-LK.h)*(1-Math.exp(-dt*CFG.likeRise));else LK.h=Math.max(tg,LK.h-dt*CFG.likeFall);
 if(HEAT<LK.h)HEAT=LK.h}
// (beğeni göstergesi kaldırıldı: ekranda beğeni sayacı/hedefi yok)
// ---- Toplam beğeni kutlaması: 1000 / 2500 / 5000 (sonra her 5000) toplam beğenide havai fişek + "Düğün şenlendi!" ----
const CEL={on:false,pend:0,t0:0,D:9,lv:0,next:CFG.celAt[0],fw:[],sn:0,dk:0};
const FWC=['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ff9100','#f48fb1'];
const celAfter=v=>{for(const a of CFG.celAt)if(a>v)return a;return(Math.floor(v/CFG.celEvery)+1)*CFG.celEvery};
function celCheck(){if(!(LK.tot>=CEL.next))return;let v=CEL.next,k=0;while(LK.tot>=v&&k<50){CEL.pend=v;v=celAfter(v);k++}CEL.next=v}
function celStart(t){CEL.on=true;CEL.t0=t;CEL.lv=CEL.pend;CEL.pend=0;CEL.D=CEL.lv>=5000?12:9;CEL.sn=t+.2;HEAT=Math.max(HEAT,.55);SHK=Math.max(SHK,9);confetti(90,true)}
// her karede: bekleyen kutlama sakin bir anda başlar; roketler çıkar, tepede patlar
function celTick(t,dt){
 if(CEL.pend&&!CEL.on&&!EV&&!MS&&!TK&&!SW&&!AKS&&!CUR&&!INTRO.length)celStart(t);
 if(CEL.on){const u=t-CEL.t0;
  if(u>=CEL.D)CEL.on=false;
  else if(u<CEL.D-1.6&&t>=CEL.sn&&CEL.fw.length<420){CEL.sn=t+R(.38,.7)*(CEL.lv>=5000?.7:1);const sy=860,ay=R(150,470);CEL.fw.push({k:'r',x:R(150,930),y:sy,vx:R(-30,30),vy:-Math.sqrt(2*420*(sy-ay)),life:3,max:3,c:pick(FWC),r:5})}}
 CEL.dk+=((CEL.on&&t-CEL.t0<CEL.D-.8?1:0)-CEL.dk)*(1-Math.exp(-dt*2.5));if(CEL.dk<.01)CEL.dk=0;
 const f=CEL.fw;for(let i=f.length-1;i>=0;i--){const p=f[i];p.life-=dt;if(p.life<=0){f.splice(i,1);continue}
  if(p.k=='r'){p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   if(p.vy>=-25){f.splice(i,1);const n=Math.min(64,Math.max(0,520-f.length));for(let j=0;j<n;j++){const a=j/n*6.2832+R(-.05,.05),v=R(190,420);f.push({k:'s',x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(1.5,2.2),max:2.2,c:Math.random()<.2?'#ffffff':p.c,r:R(6,10)})}SHK=Math.max(SHK,3)}}
  else{p.vy+=160*dt;const d=Math.exp(-dt*1.2);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt}}}
function celDraw(){if(!CEL.fw.length&&CEL.dk<=0)return;
 g.save();if(CEL.dk>0){const gr=g.createLinearGradient(0,0,0,1000);gr.addColorStop(0,'rgba(8,10,40,'+(.62*CEL.dk)+')');gr.addColorStop(.55,'rgba(8,10,40,'+(.38*CEL.dk)+')');gr.addColorStop(1,'rgba(8,10,40,0)');g.fillStyle=gr;g.fillRect(0,0,1080,1000)}
 g.globalCompositeOperation='lighter';
 for(const p of CEL.fw){if(p.k=='r'){g.globalAlpha=1;g.strokeStyle='#ffe9a8';g.lineWidth=6;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.1,p.y-p.vy*.1);g.stroke()}
  else{const q=Math.max(0,Math.min(1,p.life/p.max));g.fillStyle=p.c;g.strokeStyle=p.c;g.lineCap='round';g.globalAlpha=Math.min(1,q*1.8);g.lineWidth=p.r*(.35+q*.55);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);g.stroke();g.beginPath();g.arc(p.x,p.y,p.r*(.35+q*.4),0,7);g.fill()}}
 g.restore()}
function celHud(t){if(!CEL.on)return;bigBanner('DÜĞÜN ŞENLENDİ!','Havai fişek zamanı!','Şenlik sürüyor!','#ffe27a',t-CEL.t0,Math.min(CEL.D-.5,6),'#ff80ab')}
window.kutlama=v=>{CEL.pend=+v||1000};
const SEEN=Object.create(null);
const P=Object.create(null),ring=[],queue=[],tot=Object.assign(Object.create(null),tot0);
function saveTot(){try{localStorage.setItem(SK_KEY,JSON.stringify(tot))}catch(e){}}
const RK={gel:8,dam:7,sag:6,ned:5,zurna:4,davul:3,l:2,n:1};
const LBL={gel:'Gelin',dam:'Damat',sag:'Sağdıç',ned:'Nedime',l:'Halay başı',zurna:'Zurnacı',davul:'Davulcu'};
const ROLE_COL={gel:'#ffffff',dam:'#1a237e',sag:'#6a1b9a',ned:'#f48fb1',l:'#f9a825',zurna:'#2e7d32',davul:'#c62828'};
const LC={gel:'#ffffff',dam:'#9fa8da',sag:'#ce93d8',ned:'#f8bbd0',l:'#ffca28',zurna:'#81c784',davul:'#ef9a9a'};
const ROLEGL={gel:'255,236,248',dam:'130,150,255',sag:'200,120,230',ned:'250,150,190',l:'255,196,30',zurna:'110,215,130',davul:'255,130,110',akraba:'255,200,60'};
const CX=540,CY=1120,RX=470,RY=250,INX=358,INY=181,OUT=40,MID=32;
// 3 halka: dış 40, orta 32, iç 28 kişi (toplam 100). k = karakter boyu çarpanı, sp = kişiler arası açı
const RGS=[{rx:RX,ry:RY,k:1,sp:.16,cl:6.15},{rx:INX,ry:INY,k:.9,sp:.19,cl:6.1},{rx:272,ry:122,k:.78,sp:.25,cl:6.1}];
const C={gel:[-56,24],dam:[56,24],ned:[-142,34],sag:[142,34],davul:[-150,-55],zurna:[150,-55]};
RK.akraba=9;LBL.akraba='Akraba';ROLE_COL.akraba='#ffb300';LC.akraba='#ffe082';
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const SK=['#f2c9a0','#e8b48a','#d9a077','#f6d5b5'],HR=['#2b1a10','#4a2c17','#1b1b1b','#6b3b1a','#a5651f'],SU=['#2c3e50','#34495e','#5b3a29','#1f2f4a','#3d3d3d'],SH=['#ffffff','#9ec9e8','#f3d98b','#c9e8c0'],DR=['#c0392b','#8e44ad','#e67e22','#d81b60','#16a085','#2980b9'];
const stay=r=>r=='akraba'?CFG.stayAk:r=='n'?CFG.stayFree:(r=='davul'||r=='zurna')?CFG.stayMus:CFG.stay;
const PRICE={akraba:CFG.akraba,gel:CFG.gel,dam:CFG.dam,sag:CFG.sag,ned:CFG.ned,l:CFG.leader,davul:CFG.davul,zurna:CFG.zurna};
// HEDİYE -> ROL (TikTok LIVE Studio hediye galerisine göre). Ad büyük/küçük harf ve boşluktan bağımsız.
// 'tempo' = sadece tempoyu artırır, birikime eklenmez. Listede olmayan hediyeler değerine göre eskisi gibi çalışır.
// Adı tam bilinmeyen hediyeler için anahtar kelime de bakılır: adında 'bouquet'/'buket' geçen = damat, 'perfume'/'parfum' geçen = gelin.
const gnorm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9çğıöşü]/g,'');
const GIFTROLE=Object.create(null);
for(const[r,L]of[['tempo',['Rose']],['l',['Blue Bead']],['sag',['Rosa']],['ned',['Heart']],['gel',['Perfume']],['dam',['Bouquet','Flower Bouquet','Rose Bouquet','Buket']],['akraba',['Doughnut']],['davul',['Finger Heart','Fingerheart','Parmak Kalp']],['zurna',['Turkish Coffee','Türk Kahvesi','Turk Kahvesi']]])for(const n of L)GIFTROLE[gnorm(n)]=r;
const GIFTKEY=[['bouquet','dam'],['buket','dam'],['perfume','gel'],['parfum','gel'],['parfüm','gel'],['fingerheart','davul'],['parmakkalp','davul'],['turkishcoffee','zurna'],['turkcoffee','zurna'],['kahve','zurna']];
const giftRole=(...a)=>{for(const x of a){const k=gnorm(x);if(!k)continue;if(GIFTROLE[k])return GIFTROLE[k];for(const[w,r]of GIFTKEY)if(k.includes(w))return r}return''};
const giftLbl=(a,b)=>{const r=giftRole(a,b);return r=='tempo'?'TEMPO':r?(LBL[r]||r).toUpperCase():'eşleşmedi'};
const INTRO=[],AQ=[],WL=new Set(),FX=[],cam={z:1,fx:540,fy:1100,sk:0};let CUR=null;
// Giriş sahnesi yazıları: t1 büyük başlık, t2 alt yazı, c renk, zm kamera yakınlaşması, dur toplam süre (sn)
const IN={
 akraba:{t1:'AKRABA GELDİ!',t2:'Saçı saçılıyor!',c:'#ffd54f',zm:1.4,dur:2.8},
 gel:{t1:'GELİN GELİYOR!',t2:'Gelin salona giriyor!',c:'#ffffff',zm:1.32,dur:2.7},
 dam:{t1:'DAMAT GELİYOR!',t2:'Damat salona giriyor!',c:'#9fa8da',zm:1.28,dur:2.5},
 sag:{t1:'SAĞDIÇ GELDİ!',t2:'Damadın sağ kolu iş başında',c:'#ce93d8',zm:1.25,dur:2.5},
 ned:{t1:'NEDİME GELDİ!',t2:'Gelinin sağ kolu geldi',c:'#f8bbd0',zm:1.25,dur:2.5},
 l:{t1:'HALAY BAŞI!',t2:'Mendil artık onda!',c:'#ffca28',zm:1.2,dur:2.3},
 davul:{t1:'DAVULCU GELDİ!',t2:'Dum dum! Davul sahnede',c:'#ef9a9a',zm:1.2,dur:2.3},
 zurna:{t1:'ZURNACI GELDİ!',t2:'Zurna çalıyor, halay dönüyor',c:'#81c784',zm:1.2,dur:2.3}};
// Yerini kaptıranın sahneden atılış tarzı
const EXIT={
 akraba:{vx:780,vy:-720,g:900,sp:11,msg:'Ben gidiyorum!'},
 gel:{vx:380,vy:-980,g:760,sp:3,msg:'Düğünüm!'},
 dam:{vx:1000,vy:-80,g:0,sp:0,rot0:1.5,msg:'Kayıyorum!'},

function say(p,txt,ms){p.msg=txt;p.ms=Date.now();p.mt=p.ms+ms}
function holder(r,ex){for(const k in P){const q=P[k];if(q!==ex&&q.role==r&&!q.out&&!q.leave&&!q.rep)return q}return null}
// Sahneden yürüyerek çık (süre dolunca ya da yer açmak için)
function bye(p){const now=Date.now();p.leave=true;p.lv=now;p.lx=p.x<540?-150:1230;const i=ring.indexOf(p);if(i>=0)ring.splice(i,1)}
// Halka doluysa en eski ücretsiz halaycı yerini yeni gelene bırakır (sıra beklemek yok). En az minStay sn kalmış olanlar tercih edilir.
function touch(p){if(p&&p.role=='n'&&!p.out&&!p.leave){const n=Date.now();p.act=n;p.exp=Math.max(p.exp,n+CFG.stayFree*1000)}} // yazan/beğenen/hediye atan halaycının süresi yenilenir
function makeRoom(){if(ring.length<CFG.max)return true;const now=Date.now();let best=null,old=null;
 for(const q of ring){if(q.role!='n'||q.out||q.leave||q.pend||q.ent||q.hid)continue;const j=q.jt||0,a=q.act||j; // yer gerekirse en uzun süredir sessiz kalan çıkar
  if(!old||a<(old.act||old.jt||0))old=q;if(now-j>=CFG.minStay*1000&&(!best||a<(best.act||best.jt||0)))best=q}
 const v=best||old;if(!v)return false;bye(v);if(Math.random()<.3)say(v,pick(['Yerimi veriyorum!','Hoşça kalın!','Görüşürüz!']),1500);return true}
// Birikmiş coin'e göre alınabilecek en yüksek rol (gelin/damat ve nedime/sağdıç cinsiyete göre)
function bestRole(u,male){const c=tot[u]||0;
 for(const r of['akraba',male?'dam':'gel',male?'sag':'ned','l'])if(c>=PRICE[r])return r;return''}
function setRole(p,r){const was=ring.includes(p);p.role=r;
 if(r=='dam'||r=='sag'||r=='davul'||r=='zurna'||r=='akraba')p.male=true;if(r=='gel'||r=='ned')p.male=false;
 if(r=='akraba'){p.hr='#c9c9c9';p.sk='#d19a72';p.c1='#6d5a3a'}
 if(RK[r]>=3&&was)ring.splice(ring.indexOf(p),1)}

 const p={u,male:male==null?Math.random()<.5:male,sk:pick(SK),hr:pick(HR),c1:pick(SU),c2:pick(SH),dr:pick(DR),x:sd?-70:1150,y:R(1250,1350),s:1,ts:1,role:'',exp:Date.now()+stay(r)*1000,msg:'',mt:0,ms:0,ph:R(0,6),al:0,jt:Date.now(),act:Date.now()};
 P[u]=p;{const qi=queue.indexOf(u);if(qi>=0)queue.splice(qi,1)}if(r!='n')WL.delete(u);setRole(p,r);if(RK[r]<3)ring.push(p);return p}
// Rol satın al: coin harcanır, aynı rolün eski sahibi sahneden atılır, yeni gelen özel girişle gelir
function grant(u,r,male,free){const now=Date.now();let p=P[u];if(!free){tot[u]=(tot[u]||0)-PRICE[r];saveTot()}
 if(p&&p.role==r){if(r=='akraba'){if(AKS&&AKS.p===p)AKS.left=Math.min(AKS.left+10,CFG.sacDur+14);say(p,'Bir tur daha!',2000);confetti(40,false);return}p.exp=Math.min(now+3*stay(r)*1000,Math.max(p.exp,now)+stay(r)*1000);say(p,'Süre uzadı! +'+Math.round(stay(r)/60)+' dk',2200);confetti(40,false);return}
 const old=holder(r,p);if(old)old.rep=true;
 const fresh=!p;if(fresh)p=enter(u,r,male);else{setRole(p,r);p.rep=false} // rol değiştiren kişi eski roldeki 'değiştirildi' işaretini taşımaz
 if(TK&&TK.ph!='end'&&(r=='gel'||r=='dam')){tkSwap(p,r,old,fresh);return} // takı sürerken: yeni gelin/damat hemen sahneye geçer
 if(INTRO.length>=8){if(old){old.rep=false;throwOut(old)}p.exp=now+stay(r)*1000;return}
 p.pend=true;if(fresh)p.hid=true;
 INTRO.push({p,r,old})}
// Sahnede olmayan biri hediye atarsa, aynı fiyattaki iki roldan boş olanı alsın (gelin/damat, nedime/sağdıç)
function pickMale(u){const c=tot[u]||0;
 for(const[a,b,lo,hi]of[['dam','gel',PRICE.gel,PRICE.akraba],['sag','ned',PRICE.sag,PRICE.gel]])
  if(c>=lo&&c<hi){const av=!holder(a),bv=!holder(b);if(av!=bv)return av}
 return Math.random()<.5}
function onGift(u,c,gn,gid){u=String(u==null?'':u).trim();c=+c;if(!u||!(c>0))return;SEEN[u]=Date.now();touch(P[u]);const rr=giftRole(gn,gid);if(rr!='tempo')tot[u]=(tot[u]||0)+c;if(TK&&TK.ph!='end')tkGift(u,c);else{heatUp(c);toast(u,c,rr=='tempo'||c<PRICE.l)}evGift(c,u);if(rr=='tempo')return;
 const p=P[u];if(p&&(p.out||p.leave||p.pend)){saveTot();return}
 const male=p?p.male:pickMale(u),r=rr&&(tot[u]||0)>=PRICE[rr]?rr:bestRole(u,male);
 if(!r||(p&&p.role&&p.role!=r&&RK[r]<=RK[p.role])){saveTot();return}
 // Akraba (saçı) tek kişi: biri varsa diğeri sırada bekler (coin harcanmaz, sıra gelince rol verilir)
 if(r=='akraba'&&p&&p.role=='akraba'&&AQ.length){saveTot();return}
 if(r=='akraba'&&!(p&&p.role=='akraba')&&holder('akraba')){if(!AQ.includes(u))AQ.push(u);saveTot();return}
 if(!p&&r=='l'&&ring.length>=CFG.max&&!makeRoom()&&!holder('l')){WL.add(u);if(!queue.includes(u))queue.push(u);saveTot();return}
 grant(u,r,male)}
function onChat(u,t){u=(u||'').trim();t=String(t==null?'':t).trim();if(!u||!t)return;SEEN[u]=Date.now();evHit(u,t);msHit(u,t);
 let p=P[u];if(p&&(p.out||p.leave))return;
 if(!p){if(ring.length>=CFG.max&&!makeRoom()){if(!queue.includes(u))queue.push(u);return}
  const qi=queue.indexOf(u);if(qi>=0)queue.splice(qi,1);enter(u,'n');p=P[u]}
 touch(p);
 if(/^de[ğg]i[şs](tir)?[\s!.]*$/i.test(t.replace(/[İIı]/g,'i'))){if(RK[p.role]<3)p.male=!p.male;return} // 'değiş' (eski 'değiştir' de çalışır)
 say(p,t.slice(0,30),ring.length>80?2400:ring.length>55?3000:ring.length>40?4000:7000)}

const TF={st:'başlıyor',tries:0,msgs:0,last:'',ok:0,gift:'',ev:Object.create(null)};

function tfHandle(m){if(!m||typeof m!='object')return;
 const ev=String(m.event||m.type||m.eventName||'').toLowerCase();let d=m.data!=null?m.data:m;
 if(typeof d=='string'){try{d=JSON.parse(d)}catch(e){d={comment:d}}}
 if(!d||typeof d!='object')return;
 const us=d.user||{},u=pk(d,['uniqueId','username','userName','nickname','displayName'])||pk(us,['uniqueId','username','nickname']);
 if(!u)return;
 const txt=pk(d,['comment','message','text','content']);
 const per=+d.diamondCount||+d.coins||+d.giftCoins||+d.diamond_count||0,coins=per*(+d.repeatCount||1);
 if(DEBUG)console.log('TikFinity',ev,d);

 else if(ev=='like'||ev=='likemessage'||ev=='likes'){const lc=+d.likeCount||+d.count||0,tl=+d.totalLikeCount||0;let n=lc;if(!(n>0)){if(tl>0)n=LK.tl>0?tl-LK.tl:1;else if(d.likeCount==null&&d.count==null)n=1}if(tl>0)LK.tl=tl;if(n>0){TF.ok++;onLike(u,n)}}
 else if(!ev&&txt&&!per){TF.ok++;onChat(u,txt)}}
function tfConnect(){let ws;const host=['localhost','127.0.0.1'][TF.tries++%2];TF.st='bağlanıyor ('+host+')';
 try{ws=new WebSocket('ws://'+host+':21213/')}catch(e){TF.st='kurulamadı: '+(e.name||'hata');setTimeout(tfConnect,4000);return}
 ws.onopen=()=>{TF.st='BAĞLI ('+host+')'};
 ws.onmessage=e=>{TF.msgs++;TF.last=String(e.data).replace(/\s+/g,' ').slice(0,140);try{const m=JSON.parse(e.data);(Array.isArray(m)?m:[m]).forEach(x=>{const k=x&&typeof x=='object'?String(x.event||x.type||x.eventName||'?').toLowerCase().slice(0,12):'?';TF.ev[k]=(TF.ev[k]||0)+1;tfHandle(x)})}catch(x){}};
 ws.onclose=()=>{TF.st=TF.st.indexOf('BAĞLI')==0?'koptu, yeniden deniyor':'ulaşılamıyor ('+host+')';setTimeout(tfConnect,3000)};
 ws.onerror=()=>{try{ws.close()}catch(e){}}}
